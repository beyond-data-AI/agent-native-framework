version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/*"
      - "/templates/*"
      - "/templates/*/desktop"
      - "/templates/*/chrome-extension"
      - "/templates/.retired/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]

  - package-ecosystem: cargo
    directory: "/templates/clips/desktop/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]

  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
